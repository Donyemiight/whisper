services:
  - type: web
    name: whisper-frontend
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: .
    rootDir: .
    envVars:
      - key: TEE_API_URL
        value: http://whisper-tee:8787
      - key: XRPL_API_URL
        value: http://whisper-xrpl:8788
      - key: NEXT_PUBLIC_TEE_CHAIN
        value: coston2
      - key: NEXT_PUBLIC_FLARE_RPC
        value: https://coston2-api.flare.network/ext/C/rpc
    healthCheckPath: /api/health
  - type: web
    name: whisper-tee
    runtime: docker
    plan: free
    dockerfilePath: ./tee/Dockerfile
    dockerContext: .
    rootDir: .
    envVars:
      - key: VAULT_ADDRESS
        sync: false
      - key: SETTLE_ADDRESS
        sync: false
      - key: TEE_VERIFIER_ADDRESS
        sync: false
      - key: FXRP_ADDRESS
        sync: false
      - key: COSTON2_RPC
        value: https://coston2-api.flare.network/ext/C/rpc
      - key: TEE_SK
        sync: false
      - key: TEE_ID
        sync: false
      - key: TEE_MEASUREMENT
        sync: false
      - key: RELAYER_KEY
        sync: false
    healthCheckPath: /health
  - type: web
    name: whisper-xrpl
    runtime: docker
    plan: free
    dockerfilePath: ./xrpl-relay/Dockerfile
    dockerContext: .
    rootDir: .
    envVars:
      - key: XRPL_WSS
        value: wss://s.altnet.rippletest.net:51233/
      - key: TEE_INTERNAL_URL
        value: http://whisper-tee:8787
      - key: PORT
        value: "8788"
    healthCheckPath: /health

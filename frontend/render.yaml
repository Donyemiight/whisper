# Render blueprint for the Whisper frontend.
# Single-service architecture: just the Next.js app. The TEE engine runs
# in-process via a local API route (so the demo works end-to-end without
# separate services).
services:
  - type: web
    name: whisper-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: ./render-build.sh
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: TEE_INTERNAL_URL
        value: http://127.0.0.1:8787
      - key: NEXT_PUBLIC_TEE_CHAIN
        value: coston2
      - key: NEXT_PUBLIC_FLARE_RPC
        value: https://coston2-api.flare.network/ext/C/rpc

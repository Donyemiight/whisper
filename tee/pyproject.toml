[project]
name = "whisper-tee"
version = "0.1.0"
description = "Whisper TEE matching engine — sealed-bid dark pool for FXRP<->XRP, designed for Flare Confidential Compute"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42.0.0",
    "web3>=6.11.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pynacl>=1.5.0",
    "xrpl-py>=3.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "eth-account>=0.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whisper"]
